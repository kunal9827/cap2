<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabFlow - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">
    <div class="login-container" style="margin: 0; width: 100%;">
        <h1 style="margin-bottom: 5px;">CabFlow 🚖</h1>
        <p>Corporate Cab Management</p>
        
        <form id="loginForm" onsubmit="event.preventDefault(); login();" style="box-shadow:none; border:none; padding:0; margin:0; max-width: 100%;">
            <div class="form-group" style="text-align: left;">
                <label>Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Role</label>
                <select id="role">
                    <option value="admin">Admin</option>
                    <option value="vendor">Vendor</option>
                    <option value="driver">Driver</option>
                    <option value="employee">Employee</option>
                </select>
            </div>
            <button type="submit" class="btn-primary" style="padding: 12px; font-size: 16px;">Login to Dashboard</button>
            <div id="loginMessage" class="message"></div>
        </form>

        <div class="demo-credentials">
            <h4>📌 Demo Logins</h4>
            <p><strong>Admin:</strong> admin@cabflow.com / 123456</p>
            <p><strong>Vendor:</strong> vendor@cabflow.com / 123456</p>
            <p><strong>Driver:</strong> driver@cabflow.com / 123456</p>
            <p><strong>Employee:</strong> employee@cabflow.com / 123456</p>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const message = document.getElementById('loginMessage');

            if (!email || !password) {
                message.innerText = 'Please fill all fields.';
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });
                
                const data = await response.json();

                if (data.success) {
                    // Save user without password
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // Redirect based on role
                    if (data.user.role === 'admin') window.location.href = 'admin.html';
                    else if (data.user.role === 'vendor') window.location.href = 'vendor.html';
                    else if (data.user.role === 'driver') window.location.href = 'driver.html';
                    else if (data.user.role === 'employee') window.location.href = 'employee.html';
                } else {
                    message.innerText = data.error || 'Login failed.';
                }
            } catch (error) {
                console.error('Login error:', error);
                message.innerText = 'Unable to connect to the server.';
            }
        }
    </script>
</body>
</html>
