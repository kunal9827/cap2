<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabFlow - Driver Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>CabFlow 🚖</h2>
            </div>
            <ul>
                <li><a href="#" class="active">🛣️ My Trips</a></li>
                <li><a href="#" onclick="logout()" class="show-mobile-only" style="display:none;">🚪 Logout</a></li>
            </ul>
        </div>
        
        <div class="main-wrapper">
            <div class="main-header">
                <div class="page-title">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    Driver Portal
                </div>
                <div class="user-info">
                    <button type="button" class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">🌙 <span class="theme-text">Dark</span></button>
                    <span class="user-name" id="headerUserName">Driver</span>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="main-content">
                <h1>Dashboard</h1>
                
                <h2 style="font-size: 18px; margin-top: 20px;">Today's Assigned Trips</h2>
                <div id="tripsContainer" style="max-width: 600px;">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- TRACKING MODAL -->
    <div id="trackingModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Live Ride Tracking Details</h3>
                <button type="button" class="modal-close" onclick="closeTracking()">&times;</button>
            </div>
            <div class="modal-body" id="trackingModalBody">
                <!-- Rendered dynamically via renderLiveRideTracker -->
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        const user = checkAuth('driver');
        document.getElementById('headerUserName').innerText = user.name;

        if (window.innerWidth <= 768) {
            document.querySelector('.show-mobile-only').style.display = 'block';
        }

        function loadTrips() {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const container = document.getElementById('tripsContainer');
            container.innerHTML = '';
            
            let hasTrips = false;

            bookings.forEach((booking, index) => {
                if (booking.driver === user.name) {
                    hasTrips = true;
                    const tripWrapper = document.createElement('div');
                    tripWrapper.style.marginBottom = '24px';
                    
                    let actionButtons = '';
                    const s = (booking.status || '').toLowerCase();
                    if (s.includes('arriving')) {
                        actionButtons += `<button class="btn-primary" onclick="startTrip(${index})" style="background-color: #3b82f6; padding: 10px 16px; margin-right: 10px; margin-bottom: 5px;">📍 Start Trip (Passenger Picked Up)</button>`;
                        actionButtons += `<button class="btn-danger btn-sm" onclick="cancelRide(${index})" style="padding: 10px 16px; margin-bottom: 5px;">Cancel Ride</button>`;
                    } else if (s.includes('progress') || s.includes('transit') || s.includes('started')) {
                        actionButtons += `<button class="btn-primary" onclick="completeTrip(${index})" style="background-color: var(--success-color); padding: 10px 16px; margin-right: 10px; margin-bottom: 5px;">🏁 Complete Trip (Passenger Dropped)</button>`;
                        actionButtons += `<button class="btn-secondary btn-sm" onclick="trackCab(${index})" style="padding: 10px 16px; margin-bottom: 5px;">🗺️ Route Map</button>`;
                    } else if (s.includes('assign') || s.includes('confirm') || s.includes('request')) {
                        actionButtons += `<button class="btn-primary" onclick="setDriverArriving(${index})" style="background-color: #f59e0b; padding: 10px 16px; margin-right: 10px; margin-bottom: 5px;">🚗 Driver Arriving (Heading to Pickup)</button>`;
                        actionButtons += `<button class="btn-danger btn-sm" onclick="cancelRide(${index})" style="padding: 10px 16px; margin-bottom: 5px;">Cancel Ride</button>`;
                    } else if (s.includes('complete')) {
                        actionButtons += `<span style="color: var(--success-color); font-weight: 700; margin-right: 12px;">✅ Completed</span>`;
                        actionButtons += `<button class="btn-secondary btn-sm" onclick="trackCab(${index})" style="padding: 8px 14px; margin-bottom: 5px;">View Route</button>`;
                    } else if (s.includes('cancel')) {
                        actionButtons += `<span style="color: var(--danger-color); font-weight: 700;">🚫 Cancelled</span>`;
                    }

                    tripWrapper.innerHTML = `
                        ${renderLiveRideTracker(booking)}
                        <div style="margin-top: -10px; margin-bottom: 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
                            ${actionButtons}
                        </div>
                    `;
                    container.appendChild(tripWrapper);
                }
            });

            if (!hasTrips) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛣️</div>
                        <h3 class="empty-state-title">No trips assigned for today</h3>
                        <p class="empty-state-desc">You are currently on standby. Trips assigned to you will appear here live.</p>
                    </div>
                `;
            }
        }

        function setDriverArriving(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            if (bookings[index]) {
                bookings[index].status = 'Driver Arriving';
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadTrips();
            }
        }

        function startTrip(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            if (bookings[index]) {
                bookings[index].status = 'In Progress';
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadTrips();
            }
        }

        function completeTrip(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            if (bookings[index]) {
                bookings[index].status = 'Completed';
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadTrips();
            }
        }

        function cancelRide(index) {
            if (confirm("Are you sure you want to cancel this ride?")) {
                const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
                if (bookings[index]) {
                    bookings[index].status = 'Cancelled';
                    localStorage.setItem('bookings', JSON.stringify(bookings));
                    loadTrips();
                }
            }
        }

        function trackCab(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const booking = bookings[index];
            if (!booking) return;

            const modal = document.getElementById('trackingModal');
            const body = document.getElementById('trackingModalBody');
            body.innerHTML = renderLiveRideTracker(booking);
            modal.classList.add('active');
        }

        function closeTracking() {
            const modal = document.getElementById('trackingModal');
            if (modal) modal.classList.remove('active');
        }

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('trackingModal');
            if (event.target === modal) {
                closeTracking();
            }
        });

        // Init
        loadTrips();
    </script>
</body>
</html>
