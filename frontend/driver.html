<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabFlow - Driver Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>CabFlow 🚖</h2>
            </div>
            <ul>
                <li><a href="#" class="active">🛣️ My Trips</a></li>
                <li><a href="#" onclick="logout()" class="show-mobile-only" style="display:none;">🚪 Logout</a></li>
            </ul>
        </div>
        
        <div class="main-wrapper">
            <div class="main-header">
                <div class="page-title">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    Driver Portal
                </div>
                <div class="user-info">
                    <button type="button" class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">🌙 <span class="theme-text">Dark</span></button>
                    <span class="user-name" id="headerUserName">Driver</span>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="main-content">
                <h1>Dashboard</h1>
                
                <h2 style="font-size: 18px; margin-top: 20px;">Today's Assigned Trips</h2>
                <div id="tripsContainer" style="max-width: 600px;">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        const user = checkAuth('driver');
        document.getElementById('headerUserName').innerText = user.name;

        // Mobile logout display
        if (window.innerWidth <= 768) {
            document.querySelector('.show-mobile-only').style.display = 'block';
        }

        function loadTrips() {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const container = document.getElementById('tripsContainer');
            container.innerHTML = '';
            
            let hasTrips = false;

            bookings.forEach((booking, index) => {
                if (booking.driver === user.name) {
                    hasTrips = true;
                    const tripWrapper = document.createElement('div');
                    tripWrapper.style.marginBottom = '24px';
                    
                    let actionButton = '';

                    const s = (booking.status || '').toLowerCase();
                    if (s.includes('assign') || s.includes('confirm')) {
                        actionButton = `<button class="btn-primary" onclick="startTrip(${index})" style="width:100%; padding: 12px; font-size: 15px;">🚗 Start Trip (Passenger Picked Up)</button>`;
                    } else if (s.includes('transit') || s.includes('start')) {
                        actionButton = `<button class="btn-primary" onclick="completeTrip(${index})" style="width:100%; background-color: var(--success-color); padding: 12px; font-size: 15px;">🏁 Complete Trip (Passenger Dropped)</button>`;
                    } else if (s.includes('complete')) {
                        actionButton = `<div style="text-align: center; color: var(--success-color); font-weight: 700; padding: 12px; background: rgba(16, 185, 129, 0.1); border-radius: var(--border-radius-md); border: 1px solid rgba(16, 185, 129, 0.3);">✅ Trip Completed Successfully</div>`;
                    }

                    tripWrapper.innerHTML = `
                        ${renderLiveRideTracker(booking)}
                        <div style="margin-top: -12px;">
                            ${actionButton}
                        </div>
                    `;
                    container.appendChild(tripWrapper);
                }
            });

            if (!hasTrips) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛣️</div>
                        <h3 class="empty-state-title">No trips assigned for today</h3>
                        <p class="empty-state-desc">You are currently on standby. Trips assigned to you will appear here live.</p>
                    </div>
                `;
            }
        }

        function startTrip(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            if (bookings[index]) {
                bookings[index].status = 'In Transit';
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadTrips();
            }
        }

        function completeTrip(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            if (bookings[index]) {
                bookings[index].status = 'Completed';
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadTrips();
            }
        }

        // Init
        loadTrips();
    </script>
</body>
</html>
